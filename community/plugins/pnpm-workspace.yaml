packages:
  - packages/*

allowBuilds:
  # 与仓库根 pnpm-workspace.yaml 的评审结论保持一致（那里写明每条理由）。
  # 社区安装是独立根，必须自带这份清单，否则 pnpm 会把未列出的构建脚本当成安装错误。
  '@deepseek-ai/dsh-subprocess-local': true
  # better-sqlite3 自带预编译二进制（prebuilds/win32-x64.node），无需源码编译；
  # 显式拒绝 node-gyp 构建，避免无 Visual Studio 的机器安装失败。
  better-sqlite3: false
  esbuild: true
  koffi: true
  node-pty: true

# DeepSeek Harness release candidates are consumed immediately during the pre-release cycle.
minimumReleaseAge: 0
