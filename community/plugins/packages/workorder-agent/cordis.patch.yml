# workorder-agent 自研 Bundle：在 Web Profile 上挂载可热拔插 Host 与 GCP MCP。
# 配置以前端为主：Host 配置在 Harness 设置页的 workorder-agent 命名空间填写。
# 设置卡首次保存易协作 Key 时，会创建并维护名为 gcp 的 MCP 服务。
# 环境变量仅在存在时作为首次默认值回退。
- insert:
    - id: workorder-agent-host
      name: 'workorder-agent'
      inject: [webServer, agents, skills]
      config:
        enabled: true
        dataDir: !!js process.env.DATA_DIR?.trim() || ''
        adminToken: !!js process.env.ADMIN_TOKEN?.trim() || ''
        webhookToken: !!js process.env.WEBHOOK_TOKEN?.trim() || ''
        gcpUserKey: !!js process.env.GCP_USER_KEY?.trim() || ''
        gcpUrl: !!js process.env.GCP_MCP_URL?.trim() || 'https://mcp.netease.com/servers/gcp/mcp'
        gcpHost: !!js process.env.GCP_HOST?.trim() || 'promoteart.pm.netease.com'
        popoWebhookUrl: !!js process.env.POPO_WEBHOOK_URL?.trim() || ''
        popoWebhookSecret: !!js process.env.POPO_WEBHOOK_SECRET?.trim() || ''
        completedStatusId: !!js Number(process.env.GCP_COMPLETED_STATUS_ID) || 6
        projectIdChannelArt: !!js Number(process.env.PROJECT_ID_CHANNEL_ART) || 7
        projectIdReturnBusiness: !!js Number(process.env.PROJECT_ID_RETURN_BUSINESS) || 2001
        projectIdAiOperations: !!js Number(process.env.PROJECT_ID_AI_OPERATIONS) || 2004
