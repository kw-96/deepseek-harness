# GitHub 能力的聚合入口：把五个包的行合成一个 bundle，插件页只显示这一条。
#
# 本包不含任何运行时代码——能力缝的三角色（Service Definition /
# Service Provider / Consumer）仍分属各自的包，provider 保持可替换；
# 这里只负责把它们一起挂载，省掉插件页里五条并列的条目。
#
# 行顺序不承载加载语义（激活由服务可用性驱动），任意顺序都能组合出同一个宿主。
- insert:
    - id: github
      name: dsh-github
    - id: github-rest
      name: dsh-github-rest
    - id: tool-github
      name: dsh-tool-github
    - id: github-connect
      name: dsh-github-connect
    - id: ui-github
      name: dsh-ui-github
