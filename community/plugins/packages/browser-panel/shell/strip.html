<!doctype html>
<meta charset="utf-8">
<title>connection</title>
<style>
  /* The strip is the only chrome the shell adds, so it stays quiet: it should
     read as part of the app, not as a browser toolbar bolted on top. */
  :root {
    --bg: #16181d;
    --fg: #c7ccd4;
    --dim: #7d8592;
    --line: #262a32;
    --hover: #1e2229;
    --local: #4ade80;
    --remote: #60a5fa;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none; cursor: default;
  }
  #bar {
    height: 26px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px; border-bottom: 1px solid var(--line);
  }
  #pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 18px; padding: 0 8px; border-radius: 9px;
    background: var(--hover); border: 1px solid var(--line);
    cursor: pointer; white-space: nowrap;
  }
  #pill:hover { border-color: #39404b; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.local { background: var(--local); }
  #dot.remote { background: var(--remote); }
  #dot.bad { background: var(--bad); }
  #dot.busy { background: var(--dim); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #name { font-weight: 600; letter-spacing: .2px; }
  #caret { color: var(--dim); font-size: 9px; margin-left: 1px; }
  #status { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #list { display: none; padding: 4px; }
  #list.open { display: block; }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row .rdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .row .rname { flex: 1; }
  .row .rurl { color: var(--dim); font-size: 11px; }
  .row .check { color: var(--dim); width: 12px; text-align: center; }
  .hint {
    padding: 6px 9px 3px; color: var(--dim); font-size: 10.5px;
    border-top: 1px solid var(--line); margin-top: 4px; line-height: 1.45;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>

<div id="bar">
  <span id="pill" title="Switch harness">
    <span id="dot"></span>
    <span id="name">…</span>
    <span id="caret">▼</span>
  </span>
  <span id="status"></span>
</div>
<div id="list"></div>

<script>
  const BAR = 26
  const el = (id) => document.getElementById(id)
  let state = { active: null, connections: [], status: 'idle', message: '' }
  let open = false

  function kindOf(c) { return c && c.local ? 'local' : 'remote' }

  function render() {
    const active = state.connections.find((c) => c.id === state.active)
    el('name').textContent = active ? active.name : 'No connection'

    const dot = el('dot')
    dot.className = ''
    if (state.status === 'connecting') dot.classList.add('busy')
    else if (state.status === 'failed') dot.classList.add('bad')
    else if (active) dot.classList.add(kindOf(active))

    el('status').textContent =
      state.status === 'connecting' ? (state.message || 'connecting…')
      : state.status === 'failed' ? (state.message || 'could not connect')
      : ''

    const list = el('list')
    list.innerHTML = ''
    for (const c of state.connections) {
      const row = document.createElement('div')
      row.className = 'row'
      row.innerHTML =
        '<span class="check">' + (c.id === state.active ? '✓' : '') + '</span>'
        + '<span class="rdot"></span>'
        + '<span class="rname"></span>'
        + '<span class="rurl"></span>'
      row.querySelector('.rdot').style.background =
        kindOf(c) === 'local' ? 'var(--local)' : 'var(--remote)'
      row.querySelector('.rname').textContent = c.name
      row.querySelector('.rurl').textContent = c.local ? 'this machine' : c.url.replace(/^https?:\/\//, '')
      row.onclick = () => { setOpen(false); window.dshShell.connect(c.id) }
      list.appendChild(row)
    }
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.innerHTML = 'Add connections in <code>~/.dsh-shell/connections.json</code>'
    list.appendChild(hint)
  }

  function setOpen(v) {
    open = v
    el('list').classList.toggle('open', v)
    // Main has to grow the view before the list can be seen -- the strip's
    // bounds clip it otherwise.
    const h = v ? BAR + el('list').scrollHeight + 4 : BAR
    window.dshShell.setExpanded(v, h)
  }

  el('pill').onclick = (e) => { e.stopPropagation(); setOpen(!open) }
  document.addEventListener('click', () => { if (open) setOpen(false) })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) setOpen(false) })

  window.dshShell.onState((s) => { state = s; render(); if (open) setOpen(true) })
  window.dshShell.getState().then((s) => { state = s; render() })
</script>
