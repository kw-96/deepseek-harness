# Figma MCP 接入（配置组合包，无 Host/Client 入口代码）
#
# 插入两条已安装的 @deepseek-ai/dsh-mcp-client，分别挂两台互补的服务器：
#
#   1) figma        —— Framelink figma-developer-mcp（GLips/Figma-Context-MCP，MIT）
#                      走 Figma REST API，只读，不需要 Figma 桌面版。
#                      工具：get_figma_data、download_figma_images
#   2) figma-canvas —— figma-ui-mcp（TranHoaiHung/figma-ui-mcp，MIT）
#                      经 Figma 桌面版里的开发插件桥接，可读可写。
#                      工具：figma_write（画布上创建/修改）、figma_read、figma_status、
#                      figma_docs、figma_rules
#
# 为什么写画布必须走第二台：
# 官方 MCP 的写工具（use_figma、create_new_file、generate_figma_design、
# upload_assets、generate_diagram 等）全部标注 Remote only——桌面版本地服务器
# 只有读工具，因此官方两条路都走不通：远程端点受 MCP Catalog 白名单与席位限制
# （其动态客户端注册端点对目录外客户端返回 403，dsh-mcp-client 也不实现 OAuth
# 刷新），本地端点则根本不提供写能力。figma-ui-mcp 用 Figma Plugin API 补上这段：
# 插件在 Figma 内长轮询 localhost:38451，写操作经插件落到画布，不需要 API 令牌。
#
# 代价：figma-canvas 要求 Figma 桌面版常驻，并把本组合包固定的插件目录导入一次
# （Plugins → Development → Import plugin from manifest…，选
# $DSH_HOME/figma-ui-mcp-plugin/manifest.json），之后每次运行该插件建立桥接。
# 桌面版未开时这台服务器照常启动，只是工具调用会报插件未连接；figma 那台不受影响。
#
# 令牌取自启动环境的 FIGMA_API_KEY 或 ~/.dsh/figma-api-key.txt，都不入库。
#
# Windows 上必须经 cmd /c 启动 npx：npx 是 .cmd 批处理，直接 spawn 会 ENOENT。
- insert:
    - id: mcp-figma
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: figma
        transport: stdio
        command: cmd
        args:
          - /c
          - npx
          - -y
          - figma-developer-mcp
          - --stdio
          - --image-dir
          - E:/KW/qtGit/deepseek-harness
        env:
          # 令牌解析顺序：先用启动环境（含 $DSH_HOME/.env 注入的值），
          # 再回退到只有本人可读的令牌文件；两处都缺时子进程会以
          # "Either FIGMA_API_KEY or FIGMA_OAUTH_TOKEN is required" 退出，
          # 本服务器因此不注册任何工具，直到令牌就位。
          FIGMA_API_KEY: !!js >-
            (process.env.FIGMA_API_KEY ?? '').trim()
            || (() => {
              try {
                return process.getBuiltinModule('node:fs')
                  .readFileSync(process.env.USERPROFILE + '/.dsh/figma-api-key.txt', 'utf8').trim()
              } catch {
                return ''
              }
            })()
          FRAMELINK_TELEMETRY: 'off'

    # 版本与 $DSH_HOME/figma-ui-mcp-plugin 里那份插件产物对齐；升级两者必须同时做，
    # 且升级后要在 Figma 里重新导入 manifest（插件不自动更新）。
    - id: mcp-figma-canvas
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: figma-canvas
        transport: stdio
        command: cmd
        args:
          - /c
          - npx
          - -y
          - figma-ui-mcp@2.5.26
