# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#Managed by dsh-plugin-manager. Remove this row to return control to higher-level configuration.
- {
    id: ui-schedule,
    name: "@deepseek-ai/dsh-client-ui-schedule",
    disabled: false
  }
# Expose manual Codex-thread import; automatic scanning remains opt-in.
- {
    insert:
      [
        { id: terminal, name: "@deepseek-ai/dsh-terminal" },
        {
            id: terminal-bash,
            name: "@deepseek-ai/dsh-terminal-bash",
            config: { shellDialect: "pwsh" }
          },
        { id: session-import-codex, name: "@deepseek-ai/dsh-session-import-codex" },
        # Codex 导入卡片（Plugins 设置页）：放在 profile 层而不是官方 web-app bundle，
        # 避免它随 bundle 进入官方测试夹具（会发起未 mock 的 codexImport 请求）。
        { id: ui-codex-import, name: "@deepseek-ai/dsh-client-ui-codex-import" }
      ]
  }
# 原生终端的模型工具面（terminal_open/send/read/signal/close/list）：注册在宿主层，
# 任何 preset 的会话都能用；内置 preset 不注册 terminal_* 这些名字，不会被遮蔽。
- {
    insert:
      [ { id: tool-terminal, name: "@deepseek-ai/dsh-tool-terminal" } ]
  }
# 跨会话搜索/读取工具：为 Agent 注册 session_search / session_event_* 工具。
# 两个包随 harness 检出目录提供，所以只写补丁行，不写 profile 依赖。
- {
    insert:
      [
        {
            id: tool-session-query,
            name: "@deepseek-ai/dsh-tool-session-query"
          }
      ]
  }
# 会话检索默认 openAt: never，这里改为首次搜索时打开内存索引（不落盘）。
- {
    id: session-query-sqlite,
    config: { path: ':memory:', openAt: first-search }
  }
