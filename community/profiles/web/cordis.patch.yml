# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
[
  #Managed by dsh-plugin-manager. Remove this row to return control to higher-level configuration.
  {
      id: ui-schedule,
      name: "@deepseek-ai/dsh-client-ui-schedule",
      disabled: false
    },
  # Expose manual Codex-thread import; automatic scanning remains opt-in.
  {
      insert: [
        {
            id: terminal,
            name: "@deepseek-ai/dsh-terminal"
          },
        {
            id: terminal-bash,
            name: "@deepseek-ai/dsh-terminal-bash",
            config: {
              shellDialect: "pwsh"
            }
          },
        {
            id: session-import-codex,
            name: "@deepseek-ai/dsh-session-import-codex"
          }
      ]
    },
  # web-app bundle 默认禁用工作流引擎与工作流工具（见 packages/bundle/web-app/cordis.patch.yml）；
  # 下面三行在 web profile 里重新启用它们。0.1.6 起引擎的 id 与包名由
  # workflow-worker-thread 改为 workflow-ptc——漏掉第一行会让 tool-workflow 与
  # tool-ralph 一直 pending 在 workflowEngine 上（启动只告警，功能静默缺失）。
  { id: workflow-ptc, name: "@deepseek-ai/dsh-workflow-ptc", disabled: false },
  { id: tool-workflow, name: "@deepseek-ai/dsh-tool-workflow", disabled: false },
  { id: tool-ralph, name: "@deepseek-ai/dsh-tool-ralph", disabled: false },
  # Agent 浏览器/电脑自动化。这些包官方未发布到 npm，由 community/plugins/dev.mjs
  # 在启动时从源码 checkout junction 进 profile，因此新机器同样可用。
  # browser-use 一次只能启用一个 provider，这里选 Playwright MCP 后端。
  {
      insert: [
        { id: browser-use, name: "@deepseek-ai/dsh-browser-use" },
        {
            id: browser-use-playwright-mcp,
            name: "@deepseek-ai/dsh-experimental-browser-use-playwright-mcp",
            config: { mode: launch, headless: true }
          }
      ]
    },
  # computer-use：Cua Driver 原生后端（嵌入 npm SDK，无需外部可执行文件）。
  {
      insert: [
        { id: computer-use, name: "@deepseek-ai/dsh-computer-use" },
        {
            id: computer-use-cua-driver-native,
            name: "@deepseek-ai/dsh-experimental-computer-use-cua-driver-native"
          }
      ]
    }
]
