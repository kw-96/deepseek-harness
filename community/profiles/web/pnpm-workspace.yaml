packages:
  - .

autoInstallPeers: false

nodeLinker: hoisted

allowBuilds:
  '@webkong/dsh-plugin-sidebar@https://codeload.github.com/webkong/dsh-plugin-sidebar/tar.gz/eed642b18b178c2a453e228288e91d64e1cbdb6e': true
  # better-sqlite3 自带预编译二进制（prebuilds/win32-x64.node），无需源码编译；
  # 显式拒绝 node-gyp 构建，避免无 Visual Studio 的机器安装失败。
  better-sqlite3: false
  # cloudflared 只用于 remote-web-ui 的公网隧道，而该插件已整体下线（见 retired.json）；
  # 显式拒绝，以免每台主机都下载一份用不到的二进制。
  cloudflared: false
  # better-sidebar 的真实终端依赖 node-pty 的原生二进制；pnpm 11 默认拦截
  # 构建脚本会导致「node-pty 加载失败」，这里显式放行。
  node-pty: true
  # ssh 插件的 ssh2 / cpu-features 构建脚本只产出原生加速模块，纯 JS 路径已够用；
  # 显式拒绝，既避免无 Visual Studio 的机器安装失败，也免去每次安装的交互提示。
  ssh2: false
  cpu-features: false

overrides:
  '@xberg-io/xberg': 1.0.0-rc.15
  '@deepseek-ai/dsh-pwsh-local': 0.1.2-rc.1
  '@deepseek-ai/schemastery': 3.18.2

# 依赖补丁（dsh-session-archive）：本 fork 的历史会话 id 就是裸 uuid（Codex 导入会话
# 则是 `codex-<thread-id>`），而插件把「不以 session- 开头」的 id 一律补前缀，造出宿主
# 与磁盘都不认识的名字——归档管理整列缺标题、每轮自动归档全部失败。补丁改为原样使用
# 宿主报出的 id，并放宽预览路由校验、补上旧布局投影缓存的文件名回退；另外：草稿
# （零消息的空白会话，即「新建会话」留下的空壳）不进归档桶，超过一天没人用过就回收。
# 补丁文件随模板播种，重装或重新播种 profile 都会自动重放。
patchedDependencies:
  '@linxin666/dsh-session-archive@0.3.22': patches/@linxin666__dsh-session-archive@0.3.22.patch
  # 依赖补丁（dsh-git-panel）：0.1.15 的 tarball 里 package.json 带 UTF-8 BOM，
  # 严格 JSON 解析（profile 加载 bundle 清单）会直接抛错使整个 profile 起不来。
  # 补丁只删掉这个 BOM 字节，不改任何字段。
  dsh-git-panel@0.1.15: patches/dsh-git-panel@0.1.15.patch

# 放宽新版本等待期：tool-terminal 0.1.6-alpha.1 发布不满 pnpm 的 minimumReleaseAge
# 窗口时会被拦下，而补丁层要 insert 这一行，装不上会让整棵插件树起不来。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-tool-terminal@0.1.6-alpha.1'
