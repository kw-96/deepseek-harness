<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e8eaed;
        --muted: rgba(232, 234, 237, 0.72);
        --accent: #4d6bfe;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 420px;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(232, 234, 237, 0.16);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }
      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>DeepSeek Harness</h1>
        <div class="row">
          <span class="pulse" aria-hidden="true"></span>
          <p>正在安装依赖、构建前端并启动本地 Web 服务…</p>
        </div>
        <p>首次启动可能需要几分钟；就绪后将自动进入对话窗口。</p>
      </div>
    </main>
  </body>
</html>
