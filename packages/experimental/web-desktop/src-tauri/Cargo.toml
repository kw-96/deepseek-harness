[package]
name = "dsh-web-desktop"
version = "0.1.2"
description = "Experimental DeepSeek Harness Web desktop shell"
authors = ["DeepSeek"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_web_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-web-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
